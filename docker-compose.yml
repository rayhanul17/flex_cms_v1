version: '3.8'

# ─────────────────────────────────────────────────────────────────
#  Dev Database Stack
#  MSSQL · MySQL · PostgreSQL
#
#  Usage:
#    docker compose up -d
#
#  Default credentials (DEV ONLY — change for production):
#    Username: dev / sa / postgres
#    Password: Dev@123456
#
#  ── DEV connection strings ────────────────────────────────────────
#  When the app runs on your PC (dotnet run / dotnet watch):
#    MSSQL                 : Server=localhost,1433;User Id=sa;Password=Dev@123456;TrustServerCertificate=True;
#    MySQL                 : Server=localhost;Port=3306;Database=flexcms;User=dev;Password=Dev@123456;
#    PostgreSQL            : Host=localhost;Port=5432;Database=flexcms;Username=dev;Password=Dev@123456;
#
#  ── PROD connection strings (replace placeholders) ────────────────
#    MSSQL (Azure SQL)     : Server=tcp:<server>.database.windows.net,1433;Database=<db>;User ID=<user>;Password=<pwd>;Encrypt=true;
#    MySQL (managed)       : Server=<host>;Port=3306;Database=<db>;User=<user>;Password=<pwd>;SslMode=Required;
#    PostgreSQL (managed)  : Host=<host>;Port=5432;Database=<db>;Username=<user>;Password=<pwd>;SSL Mode=Require;
#  Notes:
#    • Always URL-encode `@` `:` `/` `+` in passwords (use https://www.urlencoder.org).
#    • Don't commit prod strings — pass via env var or setup wizard.
# ─────────────────────────────────────────────────────────────────

services:

  # ── SQL Server 2022 ───────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Dev@123456
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql

  # ── MySQL 8.4 ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Dev@123456
      - MYSQL_DATABASE=testdb
      - MYSQL_USER=dev
      - MYSQL_PASSWORD=Dev@123456
    volumes:
      - mysql_data:/var/lib/mysql

  # ── PostgreSQL 16 ─────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=Dev@123456
    volumes:
      - postgres_data:/var/lib/postgresql/data

# ── Named volumes ──────────────────────────────────────────────
volumes:
  mssql_data:
  mysql_data:
  postgres_data:
