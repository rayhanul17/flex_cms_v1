version: '3.8'

# ─────────────────────────────────────────────────────────────────
#  FlexCMS v1 — Dev Database Stack
#  MSSQL · MySQL · PostgreSQL · MongoDB (single-node replica set)
#
#  Usage:
#    docker compose up -d
#
#  Connection strings:
#    MSSQL      : Server=localhost,1433;User=sa;Password=Dev@123456;
#    MySQL      : Server=localhost;Port=3306;Uid=dev;Pwd=Dev@123456;
#    PostgreSQL : Host=localhost;Port=5432;Username=dev;Password=Dev@123456;
#    MongoDB    : mongodb://dev:Dev%40123456@localhost:27017/?replicaSet=rs0&authSource=admin
# ─────────────────────────────────────────────────────────────────

services:

  # ── SQL Server 2022 ───────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flexcms-mssql
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Dev@123456
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql

  # ── MySQL 8.4 ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: flexcms-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Dev@123456
      - MYSQL_USER=dev
      - MYSQL_PASSWORD=Dev@123456
    volumes:
      - mysql_data:/var/lib/mysql

  # ── PostgreSQL 16 ─────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: flexcms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=Dev@123456
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── MongoDB 7 — single-node replica set ──────────────────────
  # Single node is enough for dev; transactions and change streams work fine.
  # rs-init runs once and exits; subsequent `docker compose up` skips it safely.
  mongodb:
    image: mongo:7
    container_name: flexcms-mongodb
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=dev
      - MONGO_INITDB_ROOT_PASSWORD=Dev@123456
    volumes:
      - mongo_data:/data/db

  mongo-rs-init:
    image: mongo:7
    container_name: flexcms-mongo-rs-init
    restart: "no"
    entrypoint: >
      bash -c "
        echo 'Waiting for mongodb...' &&
        until mongosh --host mongodb --username dev --password Dev@123456 --authenticationDatabase admin --eval 'db.runCommand({ping:1})' --quiet; do sleep 2; done &&
        mongosh --host mongodb --username dev --password Dev@123456 --authenticationDatabase admin --eval '
          try { rs.status(); print(\"Already initiated.\"); }
          catch(e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); print(\"Done.\"); }
        '
      "
    depends_on:
      - mongodb

# ── Named volumes ──────────────────────────────────────────────
volumes:
  mssql_data:
  mysql_data:
  postgres_data:
  mongo_data:
