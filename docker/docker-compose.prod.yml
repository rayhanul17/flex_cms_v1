version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
#  FlexCMS — Production Stack (single-VM, Docker-compose)
#
#  Required env vars (set via .env on the server, NEVER commit to git):
#    FLEXCMS_IMAGE      GHCR image tag, e.g. ghcr.io/org/flex_cms_v1:latest
#    MONGO_PASSWORD     MongoDB root password (generate strong: openssl rand -base64 32)
#    APP_DATA_PATH      Host path for App_Data volume (default: ./data/app_data)
#    MONGO_DATA_PATH    Host path for MongoDB data   (default: ./data/mongo)
#    DOMAIN             Public domain (used if Traefik / nginx labels enabled)
#
#  Sample .env on the server:
#    FLEXCMS_IMAGE=ghcr.io/yourorg/flex_cms_v1:1.0.0
#    MONGO_PASSWORD=Generated-Strong-Password-Here
#    APP_DATA_PATH=/opt/flexcms/data/app_data
#    MONGO_DATA_PATH=/opt/flexcms/data/mongo
#    DOMAIN=mysite.com
#
#  Usage:
#    cd /opt/flexcms
#    docker compose -f docker/docker-compose.prod.yml --env-file .env up -d
#
#  ── App → Mongo connection (used by the setup wizard / setup.json) ──────────
#  The app container resolves `mongodb` (the service name) to the Mongo
#  container's IP within the compose network. Use this exact form in the
#  setup wizard or in setup.json:
#
#    mongodb://dev:<MONGO_PASSWORD>@mongodb:27017/?authSource=admin&replicaSet=rs0
#
#  Notes:
#    • URL-encode `@` as `%40`, `:` as `%3A`, `/` as `%2F` if your password
#      contains them (https://www.urlencoder.org).
#    • Mongo is bound to 127.0.0.1:27017 on the HOST (line below) — that's
#      so you can mongodump from the host without exposing 27017 to the
#      internet. Do not change to 0.0.0.0 unless you also firewall it.
#    • Mongo runs as a single-node replica set (rs0) — required for
#      transactions. See DEVELOPER_GUIDE §13 if transactions don't work.
#    • If you need a separate read-only / app user instead of root,
#      create it once after rs.initiate() and reference that user in the
#      conn string. Never share the root password with the app long-term.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FlexCMS Application ────────────────────────────────────────────────────
  flexcms:
    image: ${FLEXCMS_IMAGE:-ghcr.io/rayhanul17/flex_cms_v1:latest}
    container_name: flexcms
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ${APP_DATA_PATH:-./data/app_data}:/app/App_Data
      - ${APP_DATA_PATH:-./data/app_data}/uploads:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    # Health check — hits the setup wizard redirect or login page
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── MongoDB 7 — single-node replica set ───────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # bind only to localhost — not exposed publicly
    environment:
      - MONGO_INITDB_ROOT_USERNAME=dev
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-Dev@123456}
    volumes:
      - ${MONGO_DATA_PATH:-./data/mongo}:/data/db
      - mongo_keyfile:/data/keyfile_dir
    entrypoint: >
      bash -c "
        if [ ! -f /data/keyfile_dir/keyfile ]; then
          openssl rand -base64 756 > /data/keyfile_dir/keyfile;
          chmod 400 /data/keyfile_dir/keyfile;
          chown 999:999 /data/keyfile_dir/keyfile;
        fi;
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/keyfile_dir/keyfile
      "
    healthcheck:
      test: ["CMD", "mongosh", "-u", "dev", "-p", "${MONGO_PASSWORD:-Dev@123456}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── Replica Set Init (runs once, then exits) ──────────────────────────────
  mongo-rs-init:
    image: mongo:7
    container_name: mongo-rs-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mongosh --host mongodb -u dev -p '${MONGO_PASSWORD:-Dev@123456}' --authenticationDatabase admin --eval '
          try { rs.status(); print(\"Already initialized.\"); }
          catch(e) {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongodb:27017\" }] });
            print(\"Replica set initialized.\");
          }
        '
      "

volumes:
  mongo_keyfile:
