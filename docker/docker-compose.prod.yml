version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
#  FlexCMS — Production Stack (single-VM, Docker-compose)
#
#  Required env vars (set via .env on the server, NEVER commit to git):
#    FLEXCMS_IMAGE      GHCR image tag, e.g. ghcr.io/org/flex_cms_v1:latest
#    MSSQL_PASSWORD     SQL Server sa password (generate strong: openssl rand -base64 32)
#    APP_DATA_PATH      Host path for App_Data volume (default: ./data/app_data)
#    MSSQL_DATA_PATH    Host path for SQL Server data (default: ./data/mssql)
#    DOMAIN             Public domain (used if Traefik / nginx labels enabled)
#
#  Sample .env on the server:
#    FLEXCMS_IMAGE=ghcr.io/yourorg/flex_cms_v1:1.0.0
#    MSSQL_PASSWORD=Generated-Strong-Password-Here
#    APP_DATA_PATH=/opt/flexcms/data/app_data
#    MSSQL_DATA_PATH=/opt/flexcms/data/mssql
#    DOMAIN=mysite.com
#
#  Usage:
#    cd /opt/flexcms
#    docker compose -f docker/docker-compose.prod.yml --env-file .env up -d
#
#  ── App → DB connection (used by the setup wizard / setup.json) ──────────────
#  The app container resolves `mssql` (the service name) to the SQL Server
#  container's IP within the compose network. Use this exact form in the
#  setup wizard or in setup.json:
#
#    Server=mssql,1433;Database=flexcms;User Id=sa;Password=<MSSQL_PASSWORD>;TrustServerCertificate=True;
#
#  Notes:
#    • SQL Server is bound to 127.0.0.1:1433 on the HOST below — that's so you
#      can connect from the host (sqlcmd / SSMS via SSH tunnel) without
#      exposing 1433 to the internet. Do not change to 0.0.0.0 unless you also
#      firewall it.
#    • To use MySQL or PostgreSQL instead, swap the db service section below
#      and adjust the connection string in the setup wizard.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FlexCMS Application ────────────────────────────────────────────────────
  flexcms:
    image: ${FLEXCMS_IMAGE:-ghcr.io/rayhanul17/flex_cms_v1:latest}
    container_name: flexcms
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ${APP_DATA_PATH:-./data/app_data}:/app/App_Data
      - ${APP_DATA_PATH:-./data/app_data}/uploads:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── SQL Server 2022 ────────────────────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    ports:
      - "127.0.0.1:1433:1433"   # bind only to localhost — not exposed publicly
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD:-Dev@123456}
      - MSSQL_PID=Developer
    volumes:
      - ${MSSQL_DATA_PATH:-./data/mssql}:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_PASSWORD:-Dev@123456}\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
