<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="50%" stop-color="#6610f2"/>
      <stop offset="100%" stop-color="#198754"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <circle cx="900" cy="200" r="280" fill="url(#orb)"/>
  <circle cx="200" cy="500" r="220" fill="url(#orb)" opacity="0.7"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2">
    <circle cx="600" cy="300" r="80"/>
    <circle cx="600" cy="300" r="140"/>
    <circle cx="600" cy="300" r="200"/>
  </g>
  <text x="600" y="320" font-family="-apple-system, Segoe UI, sans-serif" font-size="72" font-weight="700" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" dominant-baseline="middle">FlexCMS</text>
</svg>
